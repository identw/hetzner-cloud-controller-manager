name: build
on:
  push:
    branches:
      - main
      - develop
      - 'k8s-v*'
    tags:
      - 'v*.*.*'
      - 'v*.*.*-k8s-v*'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: go test ./... -count=1
  

  docker-build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set env
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "IS_TAG=${IS_TAG}"
          if [[ $(echo ${GITHUB_REF#refs/heads/}) == "main" ]]
          then
            echo "RELEASE_VERSION=latest" >> $GITHUB_ENV
          elif [[ $(echo ${GITHUB_REF#refs/heads/}) == "develop" ]] 
          then
            echo "RELEASE_VERSION=latest-develop" >> $GITHUB_ENV 
          elif [[ ${IS_TAG} == "false" ]]
          then
            echo "RELEASE_VERSION=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV
          else 
            echo "RELEASE_VERSION=$(echo ${GITHUB_REF#refs/tags/})" >> $GITHUB_ENV
          fi
      - name: Login to registry ghcr.io
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to registry docker.io
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish tag to registry
        env:
          IMAGE: ${{ github.repository }}
        run: |
          image=`echo -n "${IMAGE}" | tr 'A-Z' 'a-z'`
          echo "${image}:${RELEASE_VERSION}"
          
          docker build -t ghcr.io/${image}:${RELEASE_VERSION} .
          docker push ghcr.io/${image}:${RELEASE_VERSION}

          docker tag ghcr.io/${image}:${RELEASE_VERSION} docker.io/${image}:${RELEASE_VERSION} 
          docker push docker.io/${image}:${RELEASE_VERSION}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker-build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          image=$(echo -n "${IMAGE}" | tr 'A-Z' 'a-z')

          changelog=""
          if [[ -f CHANGELOG.md ]]; then
            changelog=$(
              awk -v ver="${TAG}" '
                $0 == ver { found=1; next }
                found && /^v[0-9]/ { exit }
                found && /^-+$/ { next }
                found {
                  line=$0
                  sub(/^[[:space:]]+/, "", line)
                  sub(/^[*•-][[:space:]]+/, "", line)
                  if (line != "") print "1. " line
                }
              ' CHANGELOG.md
            )
          fi

          if [[ -z "${changelog}" ]]; then
            prev=$(
              git tag -l 'v*.*.*' --sort=-v:refname \
                | grep -Fxv "${TAG}" \
                | head -n1 || true
            )
            if [[ -n "${prev}" ]]; then
              changelog=$(
                git log --pretty=format:'%s' --no-merges "${prev}..${TAG}" \
                  | sed '/^$/d' \
                  | sed 's/^/1. /'
              )
            else
              changelog="1. Initial release"
            fi
          fi

          {
            echo "### changelog"
            echo "${changelog}"
            echo
            echo "### images"
            echo "**ghcr.io**"
            echo '```'
            echo "ghcr.io/${image}:${TAG}"
            echo '```'
            echo "**docker hub**"
            echo '```'
            echo "docker.io/${image}:${TAG}"
            echo '```'
          } > release-notes.md

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.md
